text><rect x="520" y="237" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="230">GE 2</text><text x="660" y="230">Readings in Philippine History</text><text x="950" y="230">3.5</text><text x="1075" y="230">3</text><rect x="520" y="263" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="256">CS 101</text><text x="660" y="256">Introduction to Computing</text><text x="950" y="256">4.0</text><text x="1075" y="256">3</text><rect x="520" y="289" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="282">MATH 103</text><text x="660" y="282">Calculus 1</text><text x="950" y="282">3.5</text><text x="1075" y="282">3</text><rect x="520" y="315" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="308">CS 102</text><text x="660" y="308">Computer Programming 1</text><text x="950" y="308">4.0</text><text x="1075" y="308">3</text><rect x="520" y="341" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="334">GE 1</text><text x="660" y="334">Understanding the Self</text><text x="950" y="334">3.0</text><text x="1075" y="334">3</text><rect x="520" y="367" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="360">CS 103</text><text x="660" y="360">Discrete Structures</text><text x="950" y="360">3.5</text><text x="1075" y="360">3</text><rect x="520" y="393" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="386">NSTP 1</text><text x="660" y="386">National Service Training</text><text x="950" y="386">3.0</text><text x="1075" y="386">3</text><rect x="520" y="419" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="412">CS 104</text><text x="660" y="412">Data Structures</text><text x="950" y="412">3.5</text><text x="1075" y="412">3</text><rect x="520" y="445" width="680" height="1" fill="#ffffff" opacity="0.5"/><text x="540" y="438">GE 2</text><text x="660" y="438">Readings in Philippine History</text><text x="950" y="438">3.5</text><text x="1075" y="438">3</text></g></g>
    
  <g filter="url(#shadow)"><rect x="640" y="18" width="500" height="404" rx="16" fill="#ffffff"/></g>
  <rect x="640.5" y="18.5" width="499" height="403" rx="15.5" fill="none" stroke="#e2e8f0"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <rect x="660" y="38" width="40" height="40" rx="10" fill="url(#tile)"/>
    <text x="680" y="65" text-anchor="middle" font-size="19" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📊</text>
    <text x="712" y="55" font-size="16" font-weight="700" fill="#1e293b">UM GWA Calculator</text>
    <text x="712" y="73" font-size="12" fill="#64748b">Academic performance tracker</text>

    <rect x="660" y="94" width="460" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M890 94.5h220a9.5 9.5 0 0 1 9.5 9.5v14a9.5 9.5 0 0 1 -9.5 9.5h-220z" fill="#2563eb"/>
    <text x="775" y="115.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">Old (1.0–5.0)</text>
    <text x="1005" y="115.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">New (1.0–4.0)</text>

    <clipPath id="rankClip"><rect x="660" y="140" width="460" height="132" rx="14"/></clipPath>
    <rect x="660" y="140" width="460" height="132" rx="14" fill="url(#legend)"/>
    <g clip-path="url(#rankClip)"><circle cx="1100" cy="160" r="50" fill="#ffffff" opacity="0.08"/><circle cx="675" cy="257" r="35" fill="#ffffff" opacity="0.06"/></g>
    <text x="890" y="179" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🏆</text>
    <text x="890" y="223" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="-0.8" fill="#ffffff">3.60</text>
    <text x="890" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" fill-opacity="0.95">Legend</text>
    <text x="890" y="262" text-anchor="middle" font-size="12.5" fill="#ffffff" fill-opacity="0.7">High Distinction</text>

    <text x="660" y="292" font-size="11.5" font-weight="600" fill="#64748b">1.00 Fail</text>
    <text x="1120" y="292" text-anchor="end" font-size="11.5" font-weight="600" fill="#64748b">4.00 Best</text>
    <rect x="660" y="298" width="460" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="660" y="298" width="398.7" height="8" rx="4" fill="url(#progress)"/>

    <rect x="660" y="314" width="148" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="734" y="339" text-anchor="middle" font-size="21" font-weight="800" fill="#1e293b">5.0</text>
    <text x="734" y="357" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#64748b">UNITS</text><rect x="816" y="314" width="148" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="890" y="339" text-anchor="middle" font-size="21" font-weight="800" fill="#1e293b">2</text>
    <text x="890" y="357" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#64748b">COURSES</text><rect x="972" y="314" width="148" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1046" y="339" text-anchor="middle" font-size="21" font-weight="800" fill="#1e293b">0</text>
    <text x="1046" y="357" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#64748b">FILTERED</text>

    <rect x="660" y="376" width="460" height="28" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="890" y="394.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">18.00 ÷ 5.0 = 3.6000</text>
  </g>
  </g>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <image x="62" y="66" width="108" height="108" href="data:image/png;base64," xlink:href="data:image/png;base64," filter="url(#iconShadow)"/>
    <text x="192" y="126" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#ffffff">GWA Gah?</text>
    <text x="195" y="158" font-size="15" font-weight="700" letter-spacing="2" fill="#fcd34d">CHROME EXTENSION · v2.1.0</text>
    <text x="64" y="240" font-size="27" font-weight="700" fill="#ffffff">Your grades, at a glance.</text>
    <text x="64" y="272" font-size="16" fill="#bfdbfe">Calculates your GWA right on the</text>
    <text x="64" y="295" font-size="16" fill="#bfdbfe">UM Student Portal Permanent Record.</text>
    <g font-size="11.5" font-weight="700" letter-spacing="1.2">
      <rect x="64" y="330" width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="142" y="351.5" text-anchor="middle" fill="#ffffff">OLD &amp; NEW SCALES</text>
      <rect x="230" y="330" width="134" height="34" rx="17" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="297" y="351.5" text-anchor="middle" fill="#fcd34d">RUNS LOCALLY</text>
      <rect x="374" y="330" width="122" height="34" rx="17" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="435" y="351.5" text-anchor="middle" fill="#6ee7b7">NO SIGN-IN</text>
    </g>
  </g>
