<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">GWA Gah? banner</title>
  <desc id="desc">The GWA Gah? logo and name on the left. On the right, the calculator card as it appears above the UM Permanent Record table, with an example GWA of 3.60 (Legend, High Distinction).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="0.55" stop-color="#132f63"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.26"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.32"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#93c5fd" opacity="0.15"/></pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0.42" stop-color="#fff" stop-opacity="0"/><stop offset="0.62" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="tableMask"><rect width="1200" height="440" fill="url(#fadeL)"/></mask>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030a1a" flood-opacity="0.45"/></filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#030a1a" flood-opacity="0.45"/></filter>
  </defs>
